<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flebox - CSS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- tipo block: objeto um embaixo do outro (título), inline: se organiza dentro da linha (link, imagem), flexbox soluciona esse problema, ele é um container -->

    <div class="container">
        <!-- div*3.item.item${Item $}, ctrl + barra mostra o atalho novamente -->
        <div class="item item1">Item 1</div>
        <div class="item item2">Item 2</div>
        <div class="item item3">Item 3</div>
        <!-- <div class="item item1">Item 1</div>
        <div class="item item2">Item 2</div>
        <div class="item item3">Item 3</div>
        <div class="item item1">Item 1</div>
        <div class="item item2">Item 2</div>
        <div class="item item3">Item 3</div> -->
        <!-- shift + alt + seta para baixo para duplicar -->

    </div>
    
</body>
</html>
